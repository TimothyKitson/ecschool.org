# Netlify configuration for ecschool.org
# The site is plain static HTML committed under public/ — there is no build
# step, so a deploy cannot fail on a build error.

[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML must always be revalidated so a new deploy is picked up immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# build.py emits site.<hash>.css, so a change always produces a new URL and
# this cache can safely be long-lived.
[[headers]]
  for = "/assets/css/site.*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The handbook slide deck's stylesheet and script are hashed the same way.
[[headers]]
  for = "/assets/css/slides.*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/slides.*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The unhashed sources are not referenced by any page; never let a browser
# hold on to them.
[[headers]]
  for = "/assets/css/site.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/css/slides.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/js/slides.js"
  [headers.values]
    Cache-Control = "no-cache"

# Font filenames are tied to their contents and never change.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos keep their filenames when replaced, so keep the window short.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# The handbook, calendar and menus are replaced in place and families need the
# current version, so always revalidate. ETags keep that cheap.
[[headers]]
  for = "/assets/pdf/*"
  [headers.values]
    Cache-Control = "no-cache"
