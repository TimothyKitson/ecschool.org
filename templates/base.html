<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="icon" href="/assets/img/logo.png">
<link rel="apple-touch-icon" href="/assets/img/logo.png">
<link rel="preload" href="/assets/fonts/bitter-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#0544a4">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="https://ecschool.org/assets/img/hero-classroom.jpg">
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"School",
  "name":"Englewood Christian School",
  "url":"https://ecschool.org",
  "telephone":"+1-941-208-5773",
  "address":{"@type":"PostalAddress","streetAddress":"571 Medical Dr","addressLocality":"Englewood","addressRegion":"FL","postalCode":"34223","addressCountry":"US"},
  "openingHours":"Mo,Tu,We,Th,Fr 07:45-15:30"
}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="header-row">
    <a class="brand" href="/">
      <img src="/assets/img/logo.png" alt="Englewood Christian School" width="300" height="300">
    </a>
    {{NAV}}
    <div class="header-right">
      <a class="header-tel" href="{{PHONE_HREF}}">{{PHONE_TEXT}}</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <b></b><span>Menu</span>
      </button>
    </div>
  </div>
</header>

<main id="main">
{{CONTENT}}
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-cols">
      <div>
        <h2>{{SITE_NAME}}</h2>
        <address>{{ADDRESS}}</address>
        <p><a href="{{PHONE_HREF}}">(941) 208-5773</a></p>
      </div>
      <div>
        <h2>Hours</h2>
        <p>Monday - Friday: 7:45 am - 3:30 pm</p>
        <p>Saturday - Sunday: Closed</p>
      </div>
    </div>
    <nav class="footer-nav" aria-label="More information">
      {{FOOTER_LINKS}}
    </nav>
  </div>
</footer>
<div class="footer-bar">
  <div class="wrap">
    <span>Copyright &copy; {{YEAR}} {{SITE_NAME}} &mdash; All Rights Reserved.</span>
    <span><a href="tel:+19412085773">(941) 208-5773</a></span>
  </div>
</div>

<script>
(function(){
  // Header expands at the top of the page and collapses once scrolled.
  var hdr=document.querySelector('.site-header');
  if(hdr){
    var compact=null;
    function onScroll(){
      var want=(window.scrollY||document.documentElement.scrollTop)>24;
      if(want===compact) return;              // only touch the DOM on a change
      compact=want;
      hdr.classList.toggle('is-compact',want);
    }
    onScroll();
    addEventListener('scroll',onScroll,{passive:true});
  }

  // Mobile nav toggle
  var t=document.querySelector('.nav-toggle'), n=document.getElementById('site-nav');
  if(t&&n){t.addEventListener('click',function(){
    var open=n.getAttribute('data-open')==='true';
    n.setAttribute('data-open',String(!open));
    t.setAttribute('aria-expanded',String(!open));
  });}
  // "More" dropdown
  document.querySelectorAll('.has-menu').forEach(function(li){
    var b=li.querySelector('button');
    b.addEventListener('click',function(e){
      e.stopPropagation();
      var open=li.getAttribute('data-open')==='true';
      li.setAttribute('data-open',String(!open));
      b.setAttribute('aria-expanded',String(!open));
    });
  });

  // Overflow nav: keep the bar to one row by moving whatever does not fit
  // into the "More" dropdown, the way the original site behaved. Items are
  // moved as real DOM nodes so they stay keyboard reachable and crawlable.
  (function(){
    var list=document.querySelector('.nav-list');
    var more=document.querySelector('.has-menu');
    if(!list||!more) return;
    var submenu=more.querySelector('.submenu');
    var top=[].slice.call(list.children).filter(function(li){return li!==more;});
    // Remember where each borrowed item came from so it can go back.
    var borrowed=[];
    // The pages that live under "More" permanently, so the button is only
    // ever removed if there is genuinely nothing behind it.
    var baseCount=submenu.children.length;
    function reflow(){
      // Put every borrowed item back before measuring a fresh layout.
      while(borrowed.length){
        var b=borrowed.pop();
        b.li.hidden=false;
        submenu.removeChild(b.clone);
      }
      // Mobile stacks the nav vertically, so everything fits as-is.
      if(getComputedStyle(list).flexDirection==='column'){
        more.hidden=baseCount===0;
        return;
      }
      more.hidden=baseCount===0;
      var cs=getComputedStyle(list);
      var avail=list.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
      var widths=top.map(function(li){li.hidden=false;return li.offsetWidth;});
      // "More" is part of the row whenever it has anything behind it, so its
      // width counts against the budget from the start.
      var moreW=more.hidden?0:more.offsetWidth;
      var used=0, cut=top.length;
      for(var i=0;i<top.length;i++){
        if(used+widths[i]+moreW>avail){ cut=i; break; }
        used+=widths[i];
      }
      if(cut===top.length) return;              // all top-level items fit
      for(var k=cut;k<top.length;k++){
        var li=top[k], clone=li.cloneNode(true);
        // Overflowed items go above the permanent "More" pages, preserving order.
        submenu.insertBefore(clone,submenu.children[k-cut]||submenu.children[0]||null);
        li.hidden=true;
        borrowed.push({li:li,clone:clone});
      }
      more.hidden=false;
    }
    reflow();
    var t;
    addEventListener('resize',function(){clearTimeout(t);t=setTimeout(reflow,120);});
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(reflow);
  })();
  document.addEventListener('click',function(){
    document.querySelectorAll('.has-menu[data-open=true]').forEach(function(li){
      li.setAttribute('data-open','false');
      li.querySelector('button').setAttribute('aria-expanded','false');
    });
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      document.querySelectorAll('.has-menu[data-open=true]').forEach(function(li){
        li.setAttribute('data-open','false');
        li.querySelector('button').setAttribute('aria-expanded','false');
      });
    }
  });
})();
</script>
</body>
</html>
